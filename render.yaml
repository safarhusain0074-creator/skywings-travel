services:
  - type: web
    name: skywings-travel
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skywings-db
          property: connectionString
      - key: DUFFEL_API_KEY
        sync: false   # set manually in Render dashboard after deploy
databases:
  - name: skywings-db
    plan: free
