<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>
<link rel="stylesheet" href="assets/css/styles.css">
<script src="assets/js/site-config.js"></script>
<script src="assets/js/app.js"></script>
</head>
<body>
<div id="site-header"></div>

<div class="container" style="margin:40px auto 60px;max-width:460px">
  <div class="form-card">
    <h2 style="margin-bottom:6px">Create your account</h2>
    <p class="form-hint" style="margin-bottom:20px">Book flights, tours and hotels in minutes.</p>
    <form id="signupForm">
      <div class="form-group"><label>Full name</label><input name="name" required></div>
      <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
      <div class="form-group"><label>Phone / WhatsApp</label><input name="phone" placeholder="03xx-xxxxxxx"></div>
      <div class="form-group"><label>Password (min 6 characters)</label><input type="password" name="password" minlength="6" required></div>
      <button class="btn btn-primary btn-block" type="submit" id="signupBtn">Create Account</button>
    </form>
    <p style="margin-top:16px;text-align:center;font-size:.92rem">Already registered? <a href="login.html">Login</a></p>
  </div>
</div>

<div id="site-footer"></div>

<script>
SW.renderChrome('signup.html');
if (SW.getToken()) location.href = 'my-bookings.html';
document.getElementById('signupForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const btn = document.getElementById('signupBtn');
  btn.disabled = true; btn.textContent = 'Creating account...';
  try {
    const { token, user } = await SW.api('/api/auth/register', { method: 'POST', body: f });
    SW.setSession(token, user);
    const next = new URLSearchParams(location.search).get('next');
    location.href = next || 'my-bookings.html';
  } catch (err) { SW.toast(err.message); btn.disabled = false; btn.textContent = 'Create Account'; }
});
</script>
</body>
</html>
