<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="assets/css/styles.css">
<script src="assets/js/site-config.js"></script>
<script src="assets/js/app.js"></script>
</head>
<body>
<div id="site-header"></div>

<div class="container" style="margin:40px auto 60px;max-width:460px">
  <div class="form-card">
    <h2 style="margin-bottom:6px">Welcome back</h2>
    <p class="form-hint" style="margin-bottom:20px">Login to manage your bookings.</p>
    <form id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Login</button>
    </form>
    <p style="margin-top:16px;text-align:center;font-size:.92rem">New here? <a href="signup.html">Create an account</a></p>
  </div>
</div>

<div id="site-footer"></div>

<script>
SW.renderChrome('login.html');
if (SW.getToken()) location.href = 'my-bookings.html';
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Logging in...';
  try {
    const { token, user } = await SW.api('/api/auth/login', { method: 'POST', body: f });
    SW.setSession(token, user);
    const next = new URLSearchParams(location.search).get('next');
    location.href = next || (user.is_admin ? 'admin.html' : 'my-bookings.html');
  } catch (err) { SW.toast(err.message); btn.disabled = false; btn.textContent = 'Login'; }
});
</script>
</body>
</html>
